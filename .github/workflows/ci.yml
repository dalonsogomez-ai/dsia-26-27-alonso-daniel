name: DSIA · Proyectos I, II y III
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg

jobs:
  proyecto-i:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proyectos/proyecto_i
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: proyectos/proyecto_i/requirements.txt
      - run: python -m pip install -r requirements.txt
      # -> Gate obligatorio del enunciado: Parte A (ventas_app) y Parte B (acciones_app), mínimo 60 %.
      - run: python -m pytest -q --cov=ventas_app --cov=acciones_app --cov-report=term-missing --cov-fail-under=60
      - name: Proyecto I · CLI A y B de extremo a extremo sin red
        run: |
          out="$RUNNER_TEMP/proyecto-i"
          python -m ventas_app.cli --input data/ventas.csv --output "$out/ventas.csv"
          # > La muestra de B es sintética (sin cotizaciones de Alpaca) y está versionada.
          python -m acciones_app.cli --input data/sample/acciones_muestra.csv --output "$out/acciones.csv"
          test -s "$out/ventas_invalidas.csv"
          test -s "$out/acciones_volatilidad.csv"
      - name: Tema 2 · tests de ejemplo
        working-directory: .
        run: python -m pytest -q 2_pruebas_y_despliegue/ejemplos

  proyectos-ii-y-iii:
    runs-on: ubuntu-latest
    # Limit the dependency install and the browser check as well as the tests.
    timeout-minutes: 15
    env:
      AI_PROVIDER: mock
      HF_TOKEN: ''
      ALPACA_PAPER_API_KEY_ID: ''
      ALPACA_PAPER_API_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            proyectos/proyecto_ii/requirements.txt
            proyectos/proyecto_iii/requirements-e2e.txt
      # > requirements-e2e.txt = dependencias fijadas del II + playwright para la prueba de navegador.
      - run: python -m pip install -r proyectos/proyecto_iii/requirements-e2e.txt
      - name: Proyecto II · pruebas offline y revisión de notebooks
        working-directory: proyectos/proyecto_ii
        run: |
          python -m pytest -q --cov=swarmtrade_app --cov-report=term-missing --cov-fail-under=80
          python -m marimo check ml_pipeline/01_eda.py ml_pipeline/02_prep.py ml_pipeline/03_model.py ml_pipeline/04_eval.py
      - name: Proyecto II · smoke de la CLI
        working-directory: proyectos/proyecto_ii
        run: |
          smoke="$RUNNER_TEMP/ii-smoke"
          python -m swarmtrade_app demo-data --output "$smoke/demo.csv" --sessions 680 --symbols 8 --seed 42
          echo "484397d268b328060950b00804c075acd8b8241165c60fb9c8119fd6e920f2f0  $smoke/demo.csv" | sha256sum -c -
          python -m swarmtrade_app train --data "$smoke/demo.csv" --run "$smoke/run" --data-kind synthetic
          python -m swarmtrade_app evaluate --run "$smoke/run"
          python -m swarmtrade_app run --data "$smoke/demo.csv" --artifact "$smoke/run/model.joblib" --output "$smoke/run/report.json" --provider mock
          test -s "$smoke/run/test_metrics.json"
          python -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['ai_status'] == 'completed', r['ai_status']" "$smoke/run/report.json"
      - name: Proyecto III · pipeline y contrato HTTP
        env:
          PYTHONPATH: proyectos/proyecto_ii:proyectos/proyecto_iii
        run: python -m pytest -q --cov=dsia_web --cov-report=term-missing --cov-fail-under=90 proyectos/proyecto_iii/tests
      - name: Proyecto III · ejecutar el lote y registrar etapas
        id: lote
        env:
          PYTHONPATH: proyectos/proyecto_ii:proyectos/proyecto_iii
        run: |
          python -m dsia_web.build demo --work runs/dsia-demo/work --output runs/dsia-demo/snapshot.json --journal runs/dsia-evidence/pipeline.jsonl
      - name: Proyecto III · navegador contra backend real
        env:
          PYTHONPATH: proyectos/proyecto_ii:proyectos/proyecto_iii
          DSIA_SNAPSHOT: runs/dsia-demo/snapshot.json
          DSIA_JOURNAL: runs/dsia-evidence/pipeline.jsonl
        run: |
          python -m playwright install --with-deps chromium --only-shell
          python -m uvicorn dsia_web.app:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/health; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          PYTHON=python bash proyectos/proyecto_iii/scripts/smoke_test.sh http://127.0.0.1:8765
          python proyectos/proyecto_iii/tests/browser_smoke.py http://127.0.0.1:8765/ \
            --screenshot runs/dsia-evidence/dashboard.png --journal runs/dsia-evidence/pipeline.jsonl \
            --expect-pipeline
      - name: Evidencia del dashboard sintético
        if: ${{ !cancelled() && (steps.lote.outcome == 'success' || steps.lote.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsia-dashboard-sintetico
          path: |
            runs/dsia-evidence/dashboard.png
            runs/dsia-evidence/pipeline.jsonl
          if-no-files-found: error
          retention-days: 30

  proyecto-iii-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -> Empaquetado verificable del III: imagen, HEALTHCHECK y smoke HTTP contra el contenedor.
      - name: Proyecto III · construir la imagen
        run: docker build -f proyectos/proyecto_iii/Dockerfile -t dsia-iii .
      - name: Proyecto III · arrancar el contenedor y esperar a healthy
        run: |
          docker run -d --name dsia-iii -p 8790:8000 dsia-iii
          for attempt in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dsia-iii)
            if [ "$status" = healthy ]; then echo "healthy tras ${attempt}s"; exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          echo "El contenedor no llegó a healthy (estado: $status)" >&2
          exit 1
      - name: Proyecto III · smoke contra el contenedor
        run: PYTHON=python3 bash proyectos/proyecto_iii/scripts/smoke_test.sh http://127.0.0.1:8790
      - name: Logs y limpieza del contenedor
        if: ${{ always() }}
        run: |
          docker logs dsia-iii || true
          docker rm -f dsia-iii || true
