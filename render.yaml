# Blueprint de Render para el Proyecto III. Refleja el servicio desplegado en
# https://dsia-swarmtrader.onrender.com (Docker, región Frankfurt, plan free, rama main).
# Usa la misma imagen que el job proyecto-iii-docker del CI. En el build, `dsia_web.build auto`:
#   - con el secret file `alpaca.env` (ALPACA_PAPER_API_KEY_ID y ALPACA_PAPER_API_SECRET_KEY)
#     descarga barras diarias reales de Alpaca hasta ayer, reentrena y publica solo predicciones;
#   - sin él, publica la demo sintética reproducible.
# Las claves (variables de entorno o secret file) se crean en el panel, nunca aquí. Al arrancar,
# dsia_web.serve refresca el informe con datos hasta ayer si hay credenciales.
# Para forzar datos nuevos: Manual Deploy → Restart service.
services:
  - type: web
    name: dsia-swarmtrader
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./proyectos/proyecto_iii/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render inyecta PORT; el CMD del Dockerfile escucha en ${PORT:-8000}.
      - key: AI_PROVIDER
        value: mock
      # Opcionales y secretos: se introducen en el panel de Render, nunca en el repositorio.
      - key: DSIA_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Alternativa a HF (cuenta HF sin saldo): se activa con AI_PROVIDER=nvidia y la clave en el panel.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      # Datos reales: dsia_web.serve las lee al arrancar (no llegan al build de Docker).
      - key: ALPACA_PAPER_API_KEY_ID
        sync: false
      - key: ALPACA_PAPER_API_SECRET_KEY
        sync: false
